version: '3.4'

networks:
  local:
    name: fabric_local

services:
  couchdb.example.com:
    container_name: couchdb.example.com
    image: couchdb:3.1.0
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "5984:5984"
    networks:
      - local
    volumes:
      - ./couchdb-data:/opt/couchdb/data
